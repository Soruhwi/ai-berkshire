<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Berkshire 대시보드</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="topbar">
    <h1>AI&nbsp;Berkshire <span class="dim">대시보드</span></h1>
    <div class="search">
      <input id="q" type="text" placeholder="한국 종목 검색 (예: 삼성전자, 005930)" autocomplete="off" />
      <div id="results" class="results" style="display:none"></div>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <h2>관심종목</h2>
      <div id="chips" class="chips"></div>
      <h2>리포트</h2>
      <div class="filter"><input id="treeFilter" type="text" placeholder="리포트 이름 필터…" /></div>
      <div id="tree" class="tree"><div class="loading">불러오는 중…</div></div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
